# ---------------------------------------------------------------------------
# my-cow-py CI/CD
#   every push / pull request -> build the image and smoke-test it (the model must load, /health = 200)
#   push a tag like v3        -> the above, then push charmzzy/cow-py:v3 (amd64 + arm64),
#                                then deploy it to the VPS (when DEPLOY_ENABLED=true)
# Repo secrets needed: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_KEY
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # load: true keeps the image in this runner's Docker so we can run it. The TensorFlow layer
      # is cached between runs (type=gha), so only code/model changes rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cow-py:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start it and wait up to ~2 min for the model to load. Prints the logs if it never comes up.
      - name: Smoke test /health
        run: |
          docker run -d --name model -p 8003:8003 cow-py:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8003/health; then echo; echo "model is up"; exit 0; fi
            sleep 2
          done
          docker logs model
          exit 1

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 build for the Oracle ARM server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # TensorFlow, NumPy and OpenCV all ship linux/aarch64 wheels, so the arm64 build installs, not compiles
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            charmzzy/cow-py:${{ github.ref_name }}
            charmzzy/cow-py:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # On with the repo variable DEPLOY_ENABLED=true; deploy.sh health-checks and rolls back on failure
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /srv/mycow/deploy.sh py ${{ github.ref_name }}
